<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
/* ============ 1. COLORS & LOOK: change these to re-theme the game ============ */
:root{
  --bg-top:#1a0536;      /* dark purple */
  --bg-bottom:#050008;   /* near black */
  --panel:rgba(40,12,80,.55);
  --neon:#00d9ff;        /* neon blue */
  --neon-soft:rgba(0,217,255,.35);
  --accent:#b44cff;      /* purple glow */
  --good:#3dffb0;
  --bad:#ff4d7d;
  --text:#e8f4ff;
  --font:'Orbitron',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh;color:var(--text);font-family:system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% -10%,var(--bg-top),var(--bg-bottom) 70%) fixed;
  padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font);font-weight:800;text-align:center;font-size:clamp(1.4rem,6vw,2.2rem);
  color:var(--neon);text-shadow:0 0 8px var(--neon),0 0 24px var(--accent);letter-spacing:.05em}
.panel{background:var(--panel);border:1px solid var(--neon-soft);border-radius:14px;padding:10px;
  box-shadow:0 0 18px rgba(180,76,255,.2),inset 0 0 20px rgba(0,217,255,.05)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button,select,input{font-family:var(--font);font-size:.72rem;color:var(--text)}
.btn{background:linear-gradient(180deg,rgba(180,76,255,.35),rgba(60,10,120,.5));border:1px solid var(--neon);
  border-radius:10px;padding:10px 14px;cursor:pointer;transition:.15s;min-height:42px}
.btn:hover{box-shadow:0 0 14px var(--neon);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.on{background:var(--neon);color:#001018;box-shadow:0 0 14px var(--neon)}
select,input{background:#10002a;border:1px solid var(--neon-soft);border-radius:10px;padding:10px;min-height:42px}
input{width:130px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stat small{display:block;font-size:.55rem;opacity:.7;margin-bottom:2px}
.stat b{font-family:var(--font);font-size:clamp(.85rem,3.6vw,1.2rem);color:var(--neon);text-shadow:0 0 8px var(--neon-soft)}
.stat b.low{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{opacity:.4}}

/* ============ Board & cards ============ */
.board-box{position:relative}
#board{--cols:4;--gap:6px;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap);
  width:min(100%,600px);margin:0 auto}
.card{aspect-ratio:1;perspective:700px;cursor:pointer;border:0;background:none;padding:0;
  font-size:calc(min(100vw - 48px,560px)/var(--cols)*.5)}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.4,.6,1)}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;line-height:1}
.front{background:linear-gradient(135deg,#2a0a5e,#0b0020);border:1px solid var(--neon-soft);color:var(--neon);
  font-family:var(--font);font-size:.6em;text-shadow:0 0 8px var(--neon)}
.card:hover:not(.flipped):not(.matched) .front{box-shadow:0 0 12px var(--neon)}
.back{transform:rotateY(180deg);background:radial-gradient(circle,#2b0b55,#12002b);border:1px solid var(--accent)}
.card.matched .back{border-color:var(--good);box-shadow:0 0 14px var(--good);animation:pop .4s}
.card.wrong .back{border-color:var(--bad);box-shadow:0 0 14px var(--bad)}
.card.hint .front{box-shadow:0 0 18px 4px var(--good);border-color:var(--good);animation:pulse .3s 4 alternate}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.12)}}

/* ============ Overlay screens ============ */
#modal{position:absolute;inset:-6px;display:none;align-items:center;justify-content:center;z-index:5;
  background:rgba(5,0,12,.88);backdrop-filter:blur(6px);border-radius:14px;text-align:center;padding:16px}
#modal.show{display:flex}
#modal h2{font-family:var(--font);font-size:clamp(1.3rem,6vw,2rem);margin-bottom:8px}
#modal.win h2{color:var(--good);text-shadow:0 0 18px var(--good);animation:glow 1s infinite alternate}
#modal.lose h2{color:var(--bad);text-shadow:0 0 18px var(--bad)}
#modal p{margin:6px 0 14px;line-height:1.5}
@keyframes glow{to{transform:scale(1.07)}}
.bit{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ============ Leaderboard ============ */
.lb h3{font-family:var(--font);font-size:.85rem;color:var(--neon);margin-bottom:6px;text-align:center}
.lb ol{list-style:none;font-size:.85rem}
.lb li{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid rgba(0,217,255,.12)}
.lb li:first-child{color:var(--good)}
.empty{opacity:.6;text-align:center;padding:6px;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>NEON MEMORY</h1>

  <div class="panel row">
    <div class="row" id="diffBtns"></div>
    <select id="theme" aria-label="Card theme"></select>
    <input id="name" maxlength="10" placeholder="Your name" aria-label="Your name">
  </div>

  <div class="panel stats">
    <div class="stat"><small>SCORE</small><b id="sScore">0</b></div>
    <div class="stat"><small>TIME</small><b id="sTime">0</b></div>
    <div class="stat"><small>MOVES</small><b id="sMoves">0</b></div>
    <div class="stat"><small>PAIRS</small><b id="sPairs">0/0</b></div>
    <div class="stat"><small>ROUND</small><b id="sRound">1</b></div>
  </div>

  <div class="board-box">
    <div id="board"></div>
    <div id="modal"><div><h2 id="mTitle"></h2><p id="mText"></p><div class="row" id="mBtns"></div></div></div>
  </div>

  <div class="row">
    <button class="btn" id="bHint"></button>
    <button class="btn" id="bPause">Pause</button>
    <button class="btn" id="bRestart">Restart</button>
    <button class="btn" id="bSound">Sound: On</button>
  </div>

  <div class="panel lb"><h3 id="lbTitle"></h3><ol id="lbList"></ol></div>
</div>

<script>
/* ============ 2. GAME SETTINGS: change these numbers to tune the game ============ */
const DIFFICULTY = {
  easy:   { label:'Easy',   cols:4, rows:4, time:60,  hints:3 },  // 16 cards = 8 pairs
  medium: { label:'Medium', cols:6, rows:6, time:180, hints:2 },  // 36 cards = 18 pairs
  hard:   { label:'Hard',   cols:8, rows:8, time:360, hints:1 }   // 64 cards = 32 pairs
};
const SETTINGS = {
  matchPoints:100,        // points for each correct pair
  missPenalty:15,         // points lost for a wrong match
  missTimePenalty:2,      // seconds lost for a wrong match
  hintCost:50,            // points lost when using a hint
  timeBonus:5,            // bonus points per second left at the end
  moveBonus:10,           // bonus per move saved (par = 3 moves per pair)
  roundTimeShrink:0.9,    // each new round, time is multiplied by this (gets harder)
  minTimeFactor:0.5,      // time never drops below this share of the starting time
  flipBackDelay:800       // ms before wrong cards flip back
};

/* ============ 3. CARD THEMES: add your own, each needs 32+ symbols ============ */
const THEMES = {
  Emoji:   '😀 😎 🤩 😜 🥳 😈 👻 🤖 👽 🎃 😻 🙈 🦄 🍕 🍔 🍟 🍩 🍪 🍉 🍓 🍒 🍍 🥑 🌮 ⚽ 🏀 🎸 🎮 🚀 🎲 🎧 🔥',
  Animals: '🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦆 🦉 🦇 🐺 🐗 🐴 🦋 🐝 🐢 🐍 🐙 🦀 🐬 🦈',
  Space:   '🚀 🛸 🌍 🌕 🌙 ⭐ 🌟 ☄️ 🪐 🌞 🌌 👽 👾 🛰️ 🔭 🧑‍🚀 ⚡ 🌠 🌑 🌒 🌓 🌔 🌖 🌗 🌘 🔆 💫 ✨ 🌈 🌋 🌊 🔮',
  Mystery: '◆ ▲ ● ■ ★ ✚ ☾ ☀ ♠ ♥ ♦ ♣ ✿ ☯ ⚔ ⚓ ✂ ✈ ☢ ☮ ♫ ⌘ ✪ ❖ ➤ ☠ ⚑ ✦ ❂ ⚙ ☁ ☂'
};

/* ============ 4. GAME CODE ============ */
const $ = id => document.getElementById(id);
const G = { diff:'easy', theme:'Emoji', cards:[], flipped:[], busy:false, started:false, paused:false,
  over:false, moves:0, pairs:0, total:0, score:0, time:0, hints:0, round:1, last:0, timer:null, sound:true };

/* ---- Sound (made with the browser, no files needed) ---- */
let audio;
function beep(freq, dur=.12, type='sine', delay=0, vol=.06){
  if(!G.sound) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + delay;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sFlip = () => beep(520,.07,'triangle');
const sMatch = () => { beep(660,.12); beep(880,.16,'sine',.1); };
const sMiss = () => beep(160,.25,'sawtooth',0,.04);
const sWin = () => [523,659,784,1047].forEach((f,i)=>beep(f,.25,'sine',i*.13));
const sLose = () => [392,330,262,196].forEach((f,i)=>beep(f,.3,'square',i*.2,.04));

/* ---- Setup ---- */
function init(){
  Object.keys(DIFFICULTY).forEach(k=>{
    const b = document.createElement('button');
    b.className='btn'; b.dataset.k=k; b.textContent=DIFFICULTY[k].label;
    b.onclick = () => { G.diff=k; newGame(true); };
    $('diffBtns').appendChild(b);
  });
  Object.keys(THEMES).forEach(t=>{ const o=document.createElement('option'); o.textContent=t; $('theme').appendChild(o); });
  $('theme').onchange = e => { G.theme=e.target.value; newGame(true); };
  $('name').value = load('mm_name','');
  $('name').onchange = e => save('mm_name', e.target.value.trim());
  $('bHint').onclick = useHint;
  $('bPause').onclick = togglePause;
  $('bRestart').onclick = () => newGame(true);
  $('bSound').onclick = () => { G.sound=!G.sound; $('bSound').textContent='Sound: '+(G.sound?'On':'Off'); };
  document.addEventListener('visibilitychange', () => { if(document.hidden && G.started && !G.over && !G.paused) togglePause(); });
  newGame(true);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* resetRound = true starts fresh at round 1; false moves on to the next (harder) round */
function newGame(resetRound){
  clearInterval(G.timer);
  const d = DIFFICULTY[G.diff];
  if(resetRound){ G.round=1; G.score=0; } else G.round++;
  const factor = Math.max(SETTINGS.minTimeFactor, Math.pow(SETTINGS.roundTimeShrink, G.round-1));
  G.time = Math.round(d.time*factor);
  G.hints = Math.max(0, d.hints - Math.floor((G.round-1)/2)); // fewer hints in later rounds
  G.total = d.cols*d.rows/2; G.pairs=0; G.moves=0;
  G.flipped=[]; G.busy=false; G.started=false; G.paused=false; G.over=false;
  const symbols = shuffle(THEMES[G.theme].split(' ')).slice(0,G.total);
  G.cards = shuffle([...symbols,...symbols].map((s,i)=>({s,id:i})));
  const board = $('board');
  board.style.setProperty('--cols', d.cols);
  board.style.setProperty('--gap', d.cols>=8 ? '4px' : '6px');
  board.innerHTML = '';
  G.cards.forEach((c,i)=>{
    const el = document.createElement('button');
    el.className='card'; el.setAttribute('aria-label','Card '+(i+1));
    el.innerHTML = '<div class="inner"><div class="face front">?</div><div class="face back">'+c.s+'</div></div>';
    el.onclick = () => flip(i);
    c.el = el; board.appendChild(el);
  });
  $('modal').className=''; 
  document.querySelectorAll('#diffBtns .btn').forEach(b=>b.classList.toggle('on', b.dataset.k===G.diff));
  $('bPause').textContent='Pause';
  updateUI(); renderLB();
}

/* ---- Playing ---- */
function flip(i){
  const c = G.cards[i];
  if(G.busy || G.paused || G.over) return;                       // blocks clicks during animations
  if(c.el.classList.contains('flipped') || c.el.classList.contains('matched')) return;
  if(G.flipped.length>=2) return;                                // never more than 2 cards
  if(!G.started){ G.started=true; G.last=performance.now(); G.timer=setInterval(tick,200); }
  c.el.classList.add('flipped'); sFlip();
  G.flipped.push(i);
  if(G.flipped.length===2){
    G.busy=true; G.moves++;
    const [a,b] = G.flipped.map(n=>G.cards[n]);
    if(a.s===b.s){
      setTimeout(()=>{
        [a,b].forEach(x=>{ x.el.classList.remove('flipped'); x.el.classList.add('matched'); });
        G.pairs++; G.score += SETTINGS.matchPoints; sMatch();
        G.flipped=[]; G.busy=false; updateUI();
        if(G.pairs===G.total) endGame(true);
      },450);
    } else {
      setTimeout(()=>{ [a,b].forEach(x=>x.el.classList.add('wrong')); sMiss();
        G.score = Math.max(0, G.score-SETTINGS.missPenalty);
        G.time = Math.max(0, G.time-SETTINGS.missTimePenalty); updateUI();
      },450);
      setTimeout(()=>{
        [a,b].forEach(x=>x.el.classList.remove('flipped','wrong'));
        setTimeout(()=>{ G.flipped=[]; G.busy=false; },450);   // wait for flip-back animation
      }, 450+SETTINGS.flipBackDelay);
    }
  }
  updateUI();
}

function tick(){
  const now = performance.now();
  if(!G.paused && !G.over){ G.time -= (now-G.last)/1000; }
  G.last = now;
  if(G.time<=0){ G.time=0; updateUI(); endGame(false); return; }
  updateUI();
}

function useHint(){
  if(G.hints<=0 || G.busy || G.paused || G.over) return;
  const open = G.cards.filter(c=>!c.el.classList.contains('matched'));
  let a = G.flipped.length===1 ? G.cards[G.flipped[0]] : open[Math.floor(Math.random()*open.length)];
  const b = G.cards.find(c=>c!==a && c.s===a.s);
  if(!b) return;
  G.hints--; G.score=Math.max(0,G.score-SETTINGS.hintCost);
  [a,b].forEach(c=>{ if(!c.el.classList.contains('flipped')) c.el.classList.add('hint'); });
  setTimeout(()=>[a,b].forEach(c=>c.el.classList.remove('hint')),1400);
  beep(900,.1,'triangle'); updateUI();
}

function togglePause(){
  if(!G.started || G.over) return;
  G.paused = !G.paused; G.last = performance.now();
  $('bPause').textContent = G.paused ? 'Resume' : 'Pause';
  if(G.paused) showModal('Paused','Cards are hidden while you rest.',[['Resume',togglePause]]);
  else $('modal').className='';
}

function endGame(win){
  G.over=true; clearInterval(G.timer);
  if(win){
    const par = G.total*3;
    const bonus = Math.round(G.time)*SETTINGS.timeBonus + Math.max(0,par-G.moves)*SETTINGS.moveBonus;
    G.score += bonus; updateUI(); sWin(); confetti();
    addScore(); 
    showModal('YOU WIN!','Score <b>'+G.score+'</b><br>Bonus +'+bonus+' for speed and fewer moves.<br>Next round has less time.',
      [['Next Round',()=>newGame(false)],['Play Again',()=>newGame(true)]],'win');
  } else {
    sLose(); addScore();
    showModal('GAME OVER','Time ran out with '+G.pairs+' of '+G.total+' pairs found.<br>Score <b>'+G.score+'</b>',
      [['Play Again',()=>newGame(true)]],'lose');
  }
}

/* ---- Screens & effects ---- */
function showModal(title,text,btns,cls=''){
  $('mTitle').textContent=title; $('mText').innerHTML=text; $('mBtns').innerHTML='';
  btns.forEach(([label,fn],i)=>{ const b=document.createElement('button'); b.className='btn'+(i?'':' on'); b.textContent=label; b.onclick=fn; $('mBtns').appendChild(b); });
  $('modal').className='show '+cls;
}
function confetti(){
  const bits = ['✨','⭐','💎','🎉','💜','💙'];
  for(let i=0;i<50;i++){
    const e=document.createElement('div'); e.className='bit'; e.textContent=bits[i%bits.length];
    e.style.left=Math.random()*100+'vw'; e.style.animationDuration=(1.8+Math.random()*2)+'s'; e.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(e); setTimeout(()=>e.remove(),4500);
  }
}
function updateUI(){
  $('sScore').textContent=G.score;
  const t=Math.ceil(G.time); $('sTime').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  $('sTime').classList.toggle('low', G.started && !G.over && t<=10);
  $('sMoves').textContent=G.moves; $('sPairs').textContent=G.pairs+'/'+G.total; $('sRound').textContent=G.round;
  $('bHint').textContent='Hint ('+G.hints+')'; $('bHint').disabled = G.hints<=0 || G.over;
}

/* ---- Leaderboard (saved in this browser) ---- */
function load(k,fallback){ try{ const v=localStorage.getItem(k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function addScore(){
  if(G.score<=0) return;
  const list = load('mm_scores_'+G.diff,[]);
  list.push({name:$('name').value.trim()||'Player', score:G.score, round:G.round});
  list.sort((a,b)=>b.score-a.score); save('mm_scores_'+G.diff, list.slice(0,5)); renderLB();
}
function renderLB(){
  $('lbTitle').textContent='Top Scores: '+DIFFICULTY[G.diff].label;
  const list = load('mm_scores_'+G.diff,[]);
  $('lbList').innerHTML = list.length
    ? list.map((s,i)=>'<li><span>'+(i+1)+'. '+s.name.replace(/[<>&]/g,'')+' (R'+s.round+')</span><b>'+s.score+'</b></li>').join('')
    : '<div class="empty">No scores yet. Be the first!</div>';
}
init();
</script>
</body>
</html>
